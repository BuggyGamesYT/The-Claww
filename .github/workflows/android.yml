name: Android APK

on:
  push:
    branches: [android-app]
    paths: ["android/**", "rust/**", ".github/workflows/android.yml"]
  workflow_dispatch:

env:
  OLLAMA_REF: v0.40.13

jobs:
  claw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-arm64
      - run: cargo install cargo-ndk --locked
      - name: Build claw for arm64 Android
        working-directory: rust
        run: |
          cargo ndk -t arm64-v8a --platform 26 build --release -p rusty-claude-cli
          mkdir -p ../out && cp target/aarch64-linux-android/release/claw ../out/libclaw.so
      - uses: actions/upload-artifact@v4
        with: { name: claw-bin, path: out/ }

  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: ollama/ollama, ref: "${{ env.OLLAMA_REF }}", path: ollama }
      - uses: actions/setup-go@v5
        with: { go-version-file: ollama/go.mod, cache-dependency-path: ollama/go.sum }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build file
      - name: Build llama-server for arm64 Android (CPU variants armv8.0 to armv9.2, picked at runtime)
        working-directory: ollama
        run: |
          NDK="$ANDROID_NDK_ROOT"
          cat > /tmp/android-arm64.cmake <<TC
          set(ANDROID_ABI arm64-v8a)
          set(ANDROID_PLATFORM android-26)
          include($NDK/build/cmake/android.toolchain.cmake)
          TC
          cmake -S llama/server -B build/ls -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/android-arm64.cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist" -DOLLAMA_LIB_DIR=lib/ollama -DOLLAMA_RUNNER_DIR= \
            -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build build/ls --parallel 4
          cmake --install build/ls --component llama-server
          find dist -type f | sort
          find build/ls -name 'libggml-cpu*.so' | sort
      - name: Build Ollama (Go) for arm64 Android
        working-directory: ollama
        run: |
          TC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
          CC="$TC/aarch64-linux-android26-clang" CXX="$TC/aarch64-linux-android26-clang++" \
            go build -trimpath -ldflags="-s -w" -o ollama-android .
          file ollama-android
      - name: Package
        working-directory: ollama
        run: |
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT/jni" "$OUT/assets/ollama"
          cp ollama-android "$OUT/jni/libollama.so"
          cp "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$OUT/jni/"
          : > "$OUT/assets/ollama_payload.txt"
          # Backend libs (CPU variants) are loaded at runtime, so make sure all of them are in the payload.
          mkdir -p dist/lib/ollama
          find build/ls -name 'lib*.so' -type f | while read -r f; do
            [ -e "dist/lib/ollama/$(basename "$f")" ] || cp "$f" dist/lib/ollama/
          done
          cd dist/lib/ollama
          find . -type f | sed 's#^\./##' | while read -r p; do
            b="$(basename "$p")"
            if file "$p" | grep -q ELF; then
              case "$b" in lib*.so) n="$b" ;; *) n="lib${b}.so" ;; esac
              cp "$p" "$OUT/jni/$n"; printf '%s\t%s\n' "$p" "$n" >> "$OUT/assets/ollama_payload.txt"
            else
              mkdir -p "$OUT/assets/ollama/$(dirname "$p")"; cp "$p" "$OUT/assets/ollama/$p"
              echo "$p" >> "$OUT/assets/ollama_payload.txt"
            fi
          done
          cat "$OUT/assets/ollama_payload.txt"
      - uses: actions/upload-artifact@v4
        with: { name: ollama-bin, path: out/ }

  apk:
    needs: [claw, ollama]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: claw-bin, path: dl/claw }
      - uses: actions/download-artifact@v4
        with: { name: ollama-bin, path: dl/ollama }
      - name: Stage native libs and assets
        run: |
          J=android/app/src/main/jniLibs/arm64-v8a; A=android/app/src/main/assets
          mkdir -p $J $A
          cp dl/claw/libclaw.so $J/
          cp dl/ollama/jni/* $J/
          cp -r dl/ollama/assets/* $A/
          ls -la $J $A
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TheClaww-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
