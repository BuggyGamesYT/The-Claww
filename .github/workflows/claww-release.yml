name: Claww release (Android + Windows + Linux)

# One combined release: Android APK, Windows installer, Arch Linux .pkg.tar.zst (plus AppImage/.deb for other distros).
# Marked Latest so it always sits on top. Started by upstream-sync.yml or by hand.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Extra release notes"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: claww-release
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA: ${{ inputs.notes }}
        run: |
          # Release version = the original ultraworkers/claw-code's latest version (v0.1.9 now, then v0.2.0 …).
          up_tag=$(gh api repos/ultraworkers/claw-code/releases/latest --jq .tag_name 2>/dev/null || true)
          [ -z "$up_tag" ] && up_tag=$(git ls-remote --tags --refs https://github.com/ultraworkers/claw-code.git | sed 's#.*refs/tags/##' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          ver="${up_tag#v}"; [ -z "$ver" ] && ver=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
          # Several Claww builds on the same claw-code version get -2, -3 … tags; the title keeps the clean version.
          tag="claww-v${ver}"; n=1
          while gh release view "$tag" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n+1)); tag="claww-v${ver}-${n}"; done
          up=$(git log -1 --format='%h %s' --first-parent origin/main 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "## The Claww v${ver}"
            echo
            echo "One release for every device. Same app everywhere: Home widgets, Chat, Projects, themes, liquid glass, animated wallpapers, photo/video/file attachments, running on Ollama."
            echo
            echo "| Download | For |"
            echo "|---|---|"
            echo "| **TheClaww.apk** | Android arm64: Pixel Tablet, Pixel 10 Pro XL and other 64-bit phones/tablets. Ollama runs inside the app. |"
            echo "| **TheClaww-windows-x64-setup.exe** | Windows 10/11 installer. Install Ollama for Windows first. |"
            echo "| **TheClaww-arch-x86_64.pkg.tar.zst** | Arch Linux: \`sudo pacman -U TheClaww-arch-x86_64.pkg.tar.zst\`, then \`sudo pacman -S ollama\`. |"
            echo "| TheClaww-linux-x86_64.AppImage / TheClaww-linux-amd64.deb | Other distros (Debian/Ubuntu etc.). |"
            echo
            echo "Built from \`android-app\` at ${GITHUB_SHA::7}. Upstream claw-code: ${up}."
            [ -n "$EXTRA" ] && { echo; echo "$EXTRA"; }
            echo; cat .github/release-install.md
          } > notes.md
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "The Claww v${ver} · PC & Android (Pixel Tablet & Pixel 10 Pro XL) + Arch Linux & Windows desktop app" --notes-file notes.md

  android:
    needs: create
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.create.outputs.tag }}
    permissions:
      contents: write

  desktop:
    needs: create
    uses: ./.github/workflows/desktop.yml
    with:
      release_tag: ${{ needs.create.outputs.tag }}
    permissions:
      contents: write

  publish:
    needs: [create, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.create.outputs.tag }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
