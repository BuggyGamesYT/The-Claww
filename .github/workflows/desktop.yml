name: Desktop (Windows & Linux)

on:
  push:
    branches: [android-app]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release tag (optional)"
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""

env:
  WHISPER_REF: v1.9.5

jobs:
  build:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04, bundles: "appimage,deb" }
          - { name: windows, os: windows-latest, bundles: "nsis" }
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            desktop/src-tauri -> target
          key: desktop-${{ matrix.name }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 file
      - name: Build claw (sidecar)
        shell: bash
        working-directory: rust
        run: |
          cargo build --release -p rusty-claude-cli
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p ../desktop/src-tauri/binaries
          cp "target/release/claw$EXT" "../desktop/src-tauri/binaries/claw-$TRIPLE$EXT"
      - uses: actions/checkout@v4
        with: { repository: ggml-org/whisper.cpp, ref: "${{ env.WHISPER_REF }}", path: whisper }
      - name: Build whisper-cli (speech to text sidecar)
        shell: bash
        working-directory: whisper
        run: |
          # Portable x86-64 build (AVX2 baseline, no -march=native), static so it runs next to the app on its own.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --target whisper-cli --parallel 4
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          BIN=$(find build -type f -name "whisper-cli$EXT" | head -1)
          echo "built $BIN"
          cp "$BIN" "../desktop/src-tauri/binaries/whisper-cli-$TRIPLE$EXT"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build app
        shell: bash
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx tauri icon app-icon.png
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          B=desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp $B/nsis/*.exe dist/TheClaww-windows-x64-setup.exe
          else
            cp $B/appimage/*.AppImage dist/TheClaww-linux-x86_64.AppImage
            cp $B/deb/*.deb dist/TheClaww-linux-amd64.deb
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: "TheClaww-${{ matrix.name }}", path: dist/ }
      - name: Attach to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Native Arch Linux package (.pkg.tar.zst, install with pacman -U), built inside an Arch container
  # so it links against Arch's own webkit2gtk-4.1.
  arch:
    name: desktop-arch
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Arch build deps
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 gtk3 librsvg openssl github-cli cmake
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: ggml-org/whisper.cpp, ref: "${{ env.WHISPER_REF }}", path: whisper }
      - name: Build claw + app
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          (cd rust && cargo build --release -p rusty-claude-cli)
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p desktop/src-tauri/binaries
          cp rust/target/release/claw "desktop/src-tauri/binaries/claw-$TRIPLE"
          (cd whisper && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF \
            && cmake --build build --target whisper-cli --parallel 4)
          cp whisper/build/bin/whisper-cli "desktop/src-tauri/binaries/whisper-cli-$TRIPLE"
          cd desktop
          npm install --no-audit --no-fund
          npx tauri icon app-icon.png
          npx tauri build --no-bundle
      - name: makepkg
        shell: bash
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          useradd -m builder
          P=/home/builder/pkg; mkdir -p $P
          cp desktop/src-tauri/target/release/the-claww rust/target/release/claw whisper/build/bin/whisper-cli desktop/src-tauri/icons/128x128.png $P/
          cat > $P/the-claww.desktop <<'DESK'
          [Desktop Entry]
          Name=The Claww
          Comment=Local AI agent with Ollama
          Exec=the-claww
          Icon=the-claww
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          DESK
          sed -i 's/^ *//' $P/the-claww.desktop
          cat > $P/PKGBUILD <<PKG
          pkgname=the-claww
          pkgver=$ver
          pkgrel=1
          pkgdesc="The Claww: local AI agent app (claw-code + Ollama)"
          arch=(x86_64)
          url="https://github.com/BuggyGamesYT/The-Claww"
          license=(MIT)
          depends=(webkit2gtk-4.1 gtk3 openssl gst-libav gst-plugins-good)
          optdepends=('ollama: run models on this PC' 'gst-plugin-pipewire: microphone on PipeWire' 'gst-plugins-bad: play more video formats (H.265/HEVC and others) in chat' 'ffmpeg: playable copies and frames from any video')
          options=(!debug !strip)
          source=(the-claww claw whisper-cli the-claww.desktop 128x128.png)
          sha256sums=(SKIP SKIP SKIP SKIP SKIP)
          package() {
            install -Dm755 the-claww "\$pkgdir/usr/lib/the-claww/the-claww"
            install -Dm755 claw "\$pkgdir/usr/lib/the-claww/claw"
            install -Dm755 whisper-cli "\$pkgdir/usr/lib/the-claww/whisper-cli"
            install -dm755 "\$pkgdir/usr/bin"
            ln -s /usr/lib/the-claww/the-claww "\$pkgdir/usr/bin/the-claww"
            install -Dm644 the-claww.desktop "\$pkgdir/usr/share/applications/the-claww.desktop"
            install -Dm644 128x128.png "\$pkgdir/usr/share/icons/hicolor/128x128/apps/the-claww.png"
          }
          PKG
          sed -i 's/^          //' $P/PKGBUILD
          chown -R builder $P
          su builder -c "cd $P && makepkg --nodeps --noconfirm"
          mkdir -p dist && cp $P/*.pkg.tar.zst dist/TheClaww-arch-x86_64.pkg.tar.zst
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: "TheClaww-arch", path: dist/ }
      - name: Attach to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "${{ inputs.release_tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
