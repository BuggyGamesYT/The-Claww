name: Upstream sync & Claww release

# Hourly: sync main with ultraworkers/claw-code and merge it into android-app, so every upstream
# change comes in as it lands. When upstream publishes a new release version (v0.2.0, v1.0, ...),
# build one combined Claww release with that same version (Android + Windows + Linux), marked Latest.
# If upstream changes workflow files, add a repo secret SYNC_TOKEN (PAT with repo + workflow scopes).
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build a Claww release even if upstream has no new release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      UP: ultraworkers/claw-code
    steps:
      - name: Sync main with upstream
        id: s
        run: |
          before=$(gh api "repos/$REPO/branches/main" --jq .commit.sha)
          gh api -X POST "repos/$REPO/merge-upstream" -f branch=main || echo "::warning::Couldn't sync main with upstream (conflict or workflow-file change). Resolve by hand or add SYNC_TOKEN."
          after=$(gh api "repos/$REPO/branches/main" --jq .commit.sha)
          [ "$before" != "$after" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Merge main into android-app
        run: |
          code=$(gh api -X POST "repos/$REPO/merges" -f base=android-app -f head=main \
            -f commit_message="Merge upstream claw-code into android-app" -i 2>/dev/null | head -1 | awk '{print $2}')
          echo "merge status: ${code:-none}"
          if [ "$code" = "409" ]; then echo "::error::android-app has a merge conflict with upstream; fix it by hand."; exit 1; fi
          [ "$code" = "201" ] && echo "MERGED=true" >> "$GITHUB_ENV" || true
      - name: Check for a new upstream release
        run: |
          up_tag=$(gh api "repos/$UP/releases/latest" --jq .tag_name 2>/dev/null || true)
          ver="${up_tag#v}"
          if [ -z "$ver" ]; then echo "NEW_RELEASE=false" >> "$GITHUB_ENV"; exit 0; fi
          if gh release list -R "$REPO" --limit 200 --json tagName --jq '.[].tagName' | grep -qE "^claww-v${ver//./\\.}(-[0-9]+)?$"; then
            echo "Already released The Claww v$ver"; echo "NEW_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "New upstream release $up_tag"; echo "NEW_RELEASE=true" >> "$GITHUB_ENV"
          fi
      - name: Start Claww release (goes on top as Latest)
        if: env.NEW_RELEASE == 'true' || inputs.force_release
        run: gh workflow run claww-release.yml --ref android-app -R "$REPO" -f notes="Built for the new upstream claw-code release."
