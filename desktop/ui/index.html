<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Claww</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wall"></div>
<div id="dim"></div>
<div id="app">
  <header id="top">
    <button class="round panel" id="btnSettings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <nav id="tabs" class="panel">
      <button data-tab="0">Home</button><button data-tab="1">Chat</button><button data-tab="2">Projects</button>
    </nav>
    <div class="row"><button class="round panel" id="btnModels" title="Models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button><button class="round panel" id="btnLook" title="Look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></div>
  </header>
  <main id="pager">
    <div id="track">
      <section class="page" id="home"></section>
      <section class="page" id="chat"></section>
      <section class="page" id="projects">
        <div class="layer" id="projList"></div>
        <div class="layer" id="projDetail"></div>
        <div class="layer" id="projChat"><aside id="projSide"></aside><div id="projChatPane"></div></div>
      </section>
    </div>
  </main>
</div>
<div id="modal" class="hidden"><div id="sheet" class="panel solid"></div></div>
<svg width="0" height="0" style="position:absolute">
  <filter id="liquid-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="lens-map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="src"/>
    <feDisplacementMap in="src" in2="map" scale="38" xChannelSelector="R" yChannelSelector="G" result="bent"/>
    <feOffset in="bent" dx="0" dy="0"/>
  </filter>
</svg>
<script src="app.js"></script>
</body>
</html>
